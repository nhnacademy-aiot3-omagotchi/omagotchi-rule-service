server:
  port: 0

eureka:
  client:
    # 테스트에서 실행 중인 Discovery Service에 연결하지 않음
    enabled: false
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: test
    password: test
  cloud:
    discovery:
      enabled: false

learning:
  base-url: http://localhost:8084
  username: rule-service
  password: test-only-rule-learning-password

auth:
  jwt:
    issuer: https://identity.omagotchi.local
    audience: omagotchi-api
    # TestJwtKeyConfig가 메모리에서 생성한 공개키 Bean을 제공
    public-key-location: classpath:unused-test-key.pem

sensor:
  broker-url: tcp://localhost:1883
  client-id: rule-service-test
  username: ""
  password: ""

influx:
  url: http://localhost:8086
  token: test-only-influx-token
  org: test-org

# @ConfigurationPropertiesScan이 있어서 프로퍼티 빈이 항상 생성되고, 생성자에서 null/blank면 예외 던지므로, 컨텍스트 안 깨지도록.
engine:
  id: test-engine
  priority: 1

internal:
  shared-secret: test-shared-secret

logging:
  level:
    root: WARN
