server:
  port: ${SERVER_PORT}

spring:
  application:
    name: rule-service
  rabbitmq:
    # 아래 listener/publisher 설정은 환경 설정이 아니라 앱 동작의 전제조건이라 base에 둠
    # - default-requeue-rejected=false: poison 메시지가 재큐잉되지 않고 DLQ(파킹 큐)로 가는 조건
    # - publisher-confirm-type=correlated: PublishRetryBuffer의 발행 확인 콜백이 동작하는 조건
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1000ms
          multiplier: 2
          max-interval: 10000ms
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
#    publisher-returns: true # routqueue를 만들지 않고 해당 옵션으로 콜백 메서드 처리도 되는듯

# RestClientConfig에서 Core API
core:
  base-url: ${CORE_BASE_URL}

eureka:
  client:
    enabled: ${EUREKA_ENABLED}
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
    serviceUrl:
      defaultZone: ${EUREKA_URL}

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
  endpoint:
    health:
      show-details: never

auth:
  jwt:
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION}

sensor:
  broker-url: ${SENSOR_BROKER_URL}
  client-id: ${SENSOR_CLIENT_ID}
  # Broker가 익명 연결을 허용하면 비워 둘 수 있음
  username: ${SENSOR_USERNAME:}
  password: ${SENSOR_PASSWORD:}

influx:
  url: ${INFLUXDB_URL}
  token: ${INFLUXDB_TOKEN}
  org: ${INFLUXDB_ORG_ID}
  buckets:
    raw: omagotchi-raw
    avg-1h: omagotchi-avg-1h
    avg-1d: omagotchi-avg-1d
  retention:
    raw-days: 7
    avg-1h-days: 365
    avg-1d-days: 0

quality:
  ranges:
    temperature:
      min: -20
      max: 60
    humidity:
      min: 0
      max: 100
    co2:
      min: 300
      max: 5000
    pressure:
      min: 800
      max: 1100
    tvoc:
      min: 0
      max: 60000
    illumination:
      min: 0
      # max 없음 (상한 없음 → Double max가 null이 됨)
    battery:
      min: 0
      max: 100
    door:
      min: 0
      max: 1

  inventory:
    - deviceEui: "24e124126d152862"
      measurement: "temperature"
      expectedIntervalSeconds: 120
    - deviceEui: "24e124126d152590"
      measurement: "temperature"
      expectedIntervalSeconds: 60
    - deviceEui: "24e124128c067999"
      measurement: "temperature"
      expectedIntervalSeconds: 60
    - deviceEui: "24e124128c140101"
      measurement: "temperature"
      expectedIntervalSeconds: 600
    - deviceEui: "24e124136d151836"
      measurement: "temperature"
      expectedIntervalSeconds: 60
    - deviceEui: "24e124725d081175"
      measurement: "temperature"
      expectedIntervalSeconds: 60
    - deviceEui: "24e124785c389010"
      measurement: "temperature"
      expectedIntervalSeconds: 60
    - deviceEui: "24e124725d089152"
      measurement: "temperature"
      expectedIntervalSeconds: 600
    - deviceEui: "sim-0002"
      measurement: "co2"
      expectedIntervalSeconds: 10


# 로그 패턴에 두 MDC값 모두 노출
# requestId(HTTP 요청 단위)와 traceId(파이프라인 메시지 단위) 둘 다 찍히도록.
# 한 쪽만 있는 로그 줄에서는 나머지 하나가 빈 문자열로 나옴 (:- 뒤가 기본값)
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p ${PID:- } --- [%15.15t] %-40.40logger{39} : [requestId=%X{requestId:-}] [traceId=%X{traceId:-}] %m%n%wEx"
