server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: rule-service

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: never

#fixme
sensor:
  broker-url: ${SENSOR_BROKER_URL:tcp://localhost:1883}
  client-id: ${SENSOR_CLIENT_ID:rule-engine-1}

core:
  base-url: "temp"