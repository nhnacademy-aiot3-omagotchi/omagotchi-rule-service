server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: rule-service

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
  endpoint:
    health:
      show-details: never

core:
  base-url: "temp"

#fixme
sensor:
  broker-url: ${SENSOR_BROKER_URL:tcp://localhost:1883}
  client-id: ${SENSOR_CLIENT_ID:rule-engine-1}

quality:
  ranges:
    temperature:
      min: -20
      max: 60
    humidity:
      min: 0
      max: 100
    co2:
      min: 300
      max: 5000
    pressure:
      min: 800
      max: 1100
    tvoc:
      min: 0
      max: 60000
    illumination:
      min: 0
      # max 없음 (상한 없음 → Double max가 null이 됨)
    battery:
      min: 0
      max: 100
    door:
      min: 0
      max: 1

  inventory:
    - deviceEui: "24e124126d152862"
      measurement: "temperature"
      expectedIntervalSeconds: 60
    - deviceEui: "24e124126d152590"
      measurement: "temperature"
      expectedIntervalSeconds: 60
    - deviceEui: "24e124128c067999"
      measurement: "temperature"
      expectedIntervalSeconds: 60
    - deviceEui: "24e124128c140101"
      measurement: "temperature"
      expectedIntervalSeconds: 900
    - deviceEui: "24e124136d151836"
      measurement: "temperature"
      expectedIntervalSeconds: 60
    - deviceEui: "24e124725d081175"
      measurement: "temperature"
      expectedIntervalSeconds: 60
    - deviceEui: "24e124785c389010"
      measurement: "temperature"
      expectedIntervalSeconds: 60
    - deviceEui: "24e124725d089152"
      measurement: "temperature"
      expectedIntervalSeconds: 900
    - deviceEui: "modbus"
      measurement: "temperature"
      expectedIntervalSeconds: 5
# 로그 패턴에 두 MDC값 모두 노출
# requestId(HTTP 요청 단위)와 traceId(파이프라인 메시지 단위) 둘 다 찍히도록.
# 한 쪽만 있는 로그 줄에서는 나머지 하나가 빈 문자열로 나옴 (:- 뒤가 기본값)
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p ${PID:- } --- [%15.15t] %-40.40logger{39} : [requestId=%X{requestId:-}] [traceId=%X{traceId:-}] %m%n%wEx"