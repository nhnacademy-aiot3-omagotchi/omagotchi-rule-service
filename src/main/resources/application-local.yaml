spring:
  config:
    # 확장자가 없는 .env를 Java properties 형식으로 읽음
    import: "optional:file:./.env[.properties]"

eureka:
  client:
    # Discovery를 함께 실행할 때 .env에서 true로 변경
    enabled: ${EUREKA_ENABLED:false}

auth:
  jwt:
    # 로컬 Identity에서 발급한 Access JWT와 같은 key pair의 public key를 사용
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:../identity-service/secrets/jwt-public.pem}
