spring:
  config:
    # .env.local을 Java properties 형식으로 읽고, 누락 시 기동 실패
    import: "file:./.env.local[.properties]"

eureka:
  client:
    # Discovery를 함께 실행할 때 .env.local에서 true로 변경
    enabled: ${EUREKA_ENABLED}
quality:
  inventory:
    # 스프링 프로파일별 yaml은 리스트를 "합치기"가 아니라 "통째로 교체"라서, sim-0002 한 줄만 추가할 방법이 없음 - 전체를 다시 적어야 함.
    # application.yaml의 목록이 바뀌면 여기도 같이 고쳐야 함.
