# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# ================================================================ #
#                    CodeRabbit 설정 파일                        #
# ================================================================ #

# 리뷰 언어 설정 - 한국어로 피드백을 받습니다
language: "ko-KR"

# 리뷰어 톤 설정
# CodeRabbit이 어떤 방식으로 피드백을 줄지 방향을 잡아줍니다
# (최대 250자 제한이 있습니다. 현재 157자)
tone_instructions: >
  1. 단순히 문제를 지적하는 것에 그치지 않고, 왜 문제인지 원인까지 설명해주세요.
  2. 더 나은 코드를 작성할 수 있도록 관련 레퍼런스나 공식 문서를 함께 제안해주세요.
  3. 잘된 부분은 가볍고 유쾌하게 칭찬해주세요.
  4. 전반적으로 함께 성장하는 동료 개발자처럼 피드백해주세요.

# ================================================================ #
#                        리뷰 상세 설정                              #
# ================================================================ #
reviews:
  # 리뷰 강도 설정
  # assertive(꼼꼼) / chill(부드럽게) 중 선택
  profile: "chill"

  # true로 설정 시, 모든 리뷰 코멘트가 resolve되면 자동으로 승인(Approve)
  request_changes_workflow: false

  # PR 요약
  high_level_summary: true       # PR 전반적인 변경 내용 요약
  changed_files_summary: true    # 파일별 변경 내용 요약

  # 워크스루를 접힌 상태로 표시해 PR 페이지가 너무 길어지는 것을 방지
  collapse_walkthrough: true

  # 코드 흐름을 시각적으로 파악할 수 있는 시퀀스 다이어그램 생성
  sequence_diagrams: true

  # 연결된 이슈를 분석해 리뷰에 맥락을 추가
  assess_linked_issues: true

  # 관련 이슈/PR 자동 링크 (팀 규모가 작아 비활성화)
  related_issues: false
  related_prs: true

  # 레이블 자동 제안/적용 (수동으로 관리)
  suggested_labels: false
  auto_apply_labels: false

  # 리뷰어 추천/자동 할당 (수동으로 지정)
  suggested_reviewers: false
  auto_assign_reviewers: false

  # PR 요약 마지막에 짧은 시 한 편을 추가합니다
  poem: false

  # docstring coverage
  pre_merge_checks:
    docstrings:
      mode: "off"

  title:
    mode: "warning"
    requirements: "무엇을 왜 바꿨는지 드러나게. 예: feat(space): 실습실 배정 API 추가"

  # AI 에이전트로 수정할 일이 많으면 true로 되돌리세요
  enable_prompt_for_ai_agents: false # 프롬프트 추천 안함

  # -------------------------------------------------------------- #
  #                       자동 리뷰 설정                             #
  # -------------------------------------------------------------- #
  auto_review:
    # PR 생성 시 자동 리뷰 (false = 원할 때만 수동으로 요청)
    # 리뷰가 필요하면 PR에 @coderabbitai review 라고 댓글을 답니다
    enabled: false

    # 아래 라벨이 붙은 PR은 자동 리뷰가 꺼져 있어도 리뷰합니다
    # 라벨 하나로 옵트인하는 방식이라 댓글보다 편합니다
    labels: ["review-ready"]

    # PR 본문에 이 키워드가 있으면 리뷰합니다 (라벨 대신 쓰고 싶다면)
    # description_keyword: "@coderabbitai"

    # 기존 리뷰가 있는 PR에 새 커밋이 추가되면 변경분만 다시 리뷰
    auto_incremental_review: true

    # 리뷰 N회 후 자동 리뷰를 일시정지 (기본 5)
    # 시간당 리뷰 한도가 있으므로 커밋이 잦으면 낮게 잡습니다
    # 멈춘 뒤에는 @coderabbitai resume 또는 @coderabbitai review 로 재개
    auto_pause_after_reviewed_commits: 2

    # 제목에 아래 키워드가 있으면 리뷰하지 않습니다
    ignore_title_keywords: ["WIP", "wip", "[skip review]"]

  # -------------------------------------------------------------- #
  #                     리뷰 대상 파일 필터                           #
  # -------------------------------------------------------------- #
  # 리뷰당 파일 수 한도가 있으므로 볼 필요 없는 파일은 제외합니다
  # ! 로 시작하면 제외, 없으면 포함
  path_filters:
    - "!**/target/**"          # 빌드 산출물
    - "!**/.mvn/**"            # Maven Wrapper
    - "!mvnw"
    - "!mvnw.cmd"
    - "!**/*.min.js"           # 압축된 정적 파일
    - "!**/*.min.css"
    - "!**/generated/**"       # 자동 생성 코드
    - "!**/*.lock"

  # -------------------------------------------------------------- #
  #                     경로별 리뷰 기준                              #
  # -------------------------------------------------------------- #
  # 우리 프로젝트 컨벤션을 리뷰 규칙으로 전달합니다
  # 이 부분이 없으면 일반적인 버그·보안 리뷰만 받게 됩니다
  path_instructions:
    - path: "**/*.java"
      instructions: |
        Backend Code Structure 규칙으로 검토해주세요.

        [의존 방향]
        presentation → application → domain, infrastructure → (application/port, domain).
        global은 feature를 의존하지 않습니다.
        - presentation이 infrastructure를 import하면 지적해주세요.
        - application이 JpaRepository, PasswordEncoder, JWT Encoder·Decoder, HTTP·RabbitMQ Client,
          기술별 Query Type을 직접 쓰면 지적해주세요.
        - domain이 presentation, application, infrastructure, global을 import하면 지적해주세요.
          domain은 Java 표준 Type과 최소 JPA Mapping Annotation만 허용합니다.
        - 다른 Feature는 소유 Feature의 Application Service public Method로만 호출합니다.
          상대 Feature의 domain 객체 직접 조작, presentation·infrastructure 접근, 순환 의존은 지적해주세요.

        [배치 기준]
        불변식과 상태 전이는 domain, Use Case 순서와 Transaction은 application,
        기술 전용 제약은 infrastructure에 둡니다.
        if나 switch라는 형태만으로 domain 배치를 요구하지는 말아주세요.

        [Interface]
        실제 외부 기술 경계(DB, JWT, 외부 API, Message, Storage)에만 Interface를 둡니다.
        - port/in, port/out, Use Case Interface, Mock 편의용 Interface, 위임만 하는 Class는 지적해주세요.
        - Port 계약에 JpaRepository, Pageable, EntityManager, JWT Claims,
          HTTP·Message Client Type이 노출되면 지적해주세요.
        - Application Port가 JpaRepository를 상속하면 지적해주세요.

        [이름]
        - 역할 없는 Impl, Dto, Manager, Helper, Util, Common, Processor 접미사와
          common·util·helper 패키지는 지적해주세요.
        - Domain에 Entity나 Domain 접미사는 붙이지 않습니다.
        - 조회는 findBy...(Optional 반환) / get...(없으면 예외) / existsBy...(boolean)로 구분합니다.
        - 검증은 validate...(실패 시 예외), 조건은 is·has·can·should(boolean)로 씁니다.
        - 의미 없는 data, info, value, item, temp 변수명과 strEmail 같은 Type 반복은 지적해주세요.
        - 값의 상태를 이름에 드러냅니다: rawRefreshToken, refreshTokenHash, encodedPassword, normalizedEmail
        - 단위를 이름에 붙입니다: expiresInSeconds, timeoutMillis

        [전달 객체]
        Request·Response는 presentation, Command·Query·Result는 application, Row는 infrastructure 내부 전용입니다.
        - Dto 접미사와 dto 패키지는 쓰지 않습니다.
        - Layer만 바뀐 동일 Field 복사 객체와 빈 Command·Query·Result는 지적해주세요.
        - Domain Entity와 Persistence 전용 Type을 presentation에서 직접 반환하면 지적해주세요.
        - Result.from(domain) Factory는 같은 Feature의 Domain 입력과 변환만 허용합니다.
          Domain 상태 변경이나 Repository 호출이 있으면 지적해주세요.
        - Result나 Command에 Jackson·HTTP Annotation이 붙으면 지적해주세요.

        [예외]
        - 외부에 공개할 ErrorCode가 없는 내부 실패, Bug, 호출 계약 위반,
          예상하지 못한 DB·외부 System 실패를 BusinessException으로 감싸면 지적해주세요.
        - BusinessException(COMMON_INTERNAL_SERVER_ERROR)로 원인을 숨기면 지적해주세요.
        - RuntimeException 전체를 하나의 업무 오류로 변환하거나,
          같은 오류를 전달만 하는 중간 Exception을 만들면 지적해주세요.
        - 예외를 변환할 때 원본 cause를 보존하지 않으면 지적해주세요.
        - Controller에서 오류 응답을 직접 조립하면 지적해주세요.
        - Domain이 BusinessException, ErrorCode, HTTP를 알면 지적해주세요.

        [Transaction]
        @Transactional은 Application Service의 public Method 경계에 둡니다.
        Lock 기반 직렬화나 실패 응답 전 Commit이 필요한 기록은
        별도 Component와 Commit·Rollback Integration Test를 요구해주세요.

        [과잉 설계 억제]
        아래는 근거가 없으면 만들지 않도록 지적해주세요.
        - Use Case마다 Class·Interface 생성, 모든 Controller 앞의 Facade, Reader·Verifier 자동 분리
        - 빈 Package, 사용하지 않는 Layer, 예상만으로 만든 Port·Adapter
        - adapter 패키지와 Adapter 접미사 기본 사용

    - path: "**/domain/**/*.java"
      instructions: |
        업무 상태, 불변식, 상태 전이만 소유합니다.
        Use Case 순서, Transaction, 외부 계약 변환, 외부 입출력,
        @ConfigurationProperties 사용은 지적해주세요.

    - path: "**/application/**/*.java"
      instructions: |
        Use Case 실행 순서와 Transaction 경계를 검토해주세요.
        Domain 불변식을 application에서 다시 구현하면 지적해주세요.
        여러 요청이 동시에 들어올 때 조회 → 검증 → 수정 사이에 값이 바뀔 수 있는 흐름은
        락이나 유니크 제약 같은 방어 수단이 있는지 확인해주세요.
        DB 제약으로 표현할 수 없는 규칙(최대 N개, 최소 1명 유지 등)은
        트랜잭션 안에서 지켜지는지, 대응 테스트가 있는지 확인해주세요.

    - path: "**/presentation/**/*.java"
      instructions: |
        HTTP, MCP, Message, Scheduler 진입점 책임만 가집니다.
        Domain 객체 직접 반환과 infrastructure 직접 호출은 지적해주세요.
        Bean Validation 누락, 인증·인가 Annotation 누락,
        응답에 민감정보(비밀번호 해시, 토큰 원문, 내부 ID)가 노출되는지 확인해주세요.

    - path: "**/infrastructure/**/*.java"
      instructions: |
        Port 구현과 기술 실패 변환 책임만 가집니다.
        Application Service 호출과 presentation 참조는 지적해주세요.
        JPA N+1, Native Query의 파라미터 바인딩, Transaction 밖 Flush 시점을 확인해주세요.
        소프트 삭제를 쓰는 테이블은 조회에서 deleted_at IS NULL 필터가 빠지지 않았는지 확인해주세요.
        유니크 제약 위반이 하나의 ErrorCode와 명확히 대응하면
        여기서 BusinessException으로 변환하되 원본 cause를 보존해주세요.

    - path: "**/src/test/**/*.java"
      instructions: |
        Test 이름이 검증 대상 동작을 설명하는지 확인해주세요.
        Assertion 없는 Test, 구현 세부에 결합된 과도한 Mock 검증,
        실행 순서에 의존하는 Test는 지적해주세요.
        기존 동작을 보존해야 하는 변경에는 Characterization Test를,
        특수 Transaction에는 Commit·Rollback Integration Test를 요구해주세요.

    - path: "**/pom.xml"
      instructions: |
        공통 기술 버전을 확인해주세요: Java 21, Spring Boot 4.1.0, Spring Cloud 2025.1.2 BOM.
        Spring Boot나 Spring Cloud가 관리하는 의존성에 개별 <version>을 명시하면 지적해주세요.
        UTF-8 인코딩과 Executable JAR Packaging을 확인해주세요.

    - path: "**/src/main/resources/application*.{yml,yaml,properties}"
      instructions: |
        평문 비밀번호, Key, Token이 있으면 반드시 지적해주세요.
        환경별 분리와 기본값 안전성(ddl-auto, show-sql, open-in-view, actuator 노출 범위)을 확인해주세요.

    - path: "**/db/migration/**"
      instructions: |
        되돌릴 수 없는 DDL, 운영 테이블 Lock을 유발하는 변경,
        NOT NULL 추가 시 기본값 누락, Index 없는 FK를 지적해주세요.
        이미 적용된 Migration 파일을 수정하지 않고 새 파일로 추가하는지 확인해주세요.

    - path: ".github/workflows/**"
      instructions: |
        Secret 노출, pull_request_target 오용, 태그로만 고정된 third-party Action,
        과도한 GITHUB_TOKEN 권한을 지적해주세요.

# ================================================================ #
#                         채팅 설정                                  #
# ================================================================ #
chat:
  # @coderabbitai 멘션 없이도 PR 코멘트에 자동으로 응답
  # 사람끼리 논의하는 스레드에 봇이 끼어들면 false로 바꾸세요
  auto_reply: false

# ================================================================ #
#                       지식 베이스 설정                              #
# ================================================================ #
knowledge_base:
  # 리뷰 시 최신 문서나 정보를 웹에서 검색해 참고할 수 있도록 허용
  web_search:
    enabled: true

  # 레포에 코딩 컨벤션이나 가이드라인 문서가 있다면 리뷰에 반영
  code_guidelines:
    enabled: true
    filePatterns:
      - "docs/**/*.md"

  # 리뷰 코멘트에 답글로 알려준 내용이 저장되는 범위
  # local  = 이 레포 안에서만
  # global = 조직의 모든 레포가 공유
  # auto   = 기본값. public이면 local, private이면 global (레포 공개 여부에 따라 바뀜)
  #
  # 레포마다 컨벤션이 다르므로 local로 고정합니다.
  # auto로 두면 private일 때 다른 레포의 학습까지 섞여 들어옵니다.
  learnings:
    scope: "local"

  # 이슈·PR 문맥도 같은 이유로 이 레포 범위로 제한합니다
  issues:
    scope: "local"
  pull_requests:
    scope: "local"